<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16213A"/>
      <stop offset="0.55" stop-color="#0B1426"/>
      <stop offset="1" stop-color="#050A16"/>
    </linearGradient>
    <radialGradient id="glowE" cx="0.5" cy="1.05" r="0.6">
      <stop offset="0" stop-color="#9EC3D6" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#4F7E96" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.95" cy="0.05" r="0.6">
      <stop offset="0" stop-color="#7A5168" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#7A5168" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="streakE" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3DB878" stop-opacity="0"/>
      <stop offset="0.85" stop-color="#3DB878" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="streakT" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5CCBA0" stop-opacity="0"/>
      <stop offset="0.85" stop-color="#5CCBA0" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#E8FFFF" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="streakL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9A7C2" stop-opacity="0"/>
      <stop offset="1" stop-color="#C9A7C2" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="streakC" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C0242F" stop-opacity="0"/>
      <stop offset="0.85" stop-color="#C0242F" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFC9CF" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="streakY" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C8E06A" stop-opacity="0"/>
      <stop offset="0.85" stop-color="#C8E06A" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="horn" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#6E8FA6"/>
      <stop offset="0.5" stop-color="#D6E6EE"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="hornShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#1B2B45" stop-opacity="0.45"/>
    </linearGradient>
    <radialGradient id="bell" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#050A16"/>
      <stop offset="0.7" stop-color="#16213A"/>
      <stop offset="1" stop-color="#C9A7C2"/>
    </radialGradient>
    <filter id="blur24" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="blur6" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <linearGradient id="fadeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.66" stop-color="#FFFFFF"/>
      <stop offset="0.93" stop-color="#000000"/>
    </linearGradient>
    <mask id="fade" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="url(#fadeGrad)"/>
    </mask>
    <clipPath id="hornClip"><path d="M 232 566 Q 228 556 238 556 Q 262 598 312 608 Q 488 612 640 345 L 790 470 Q 540 728 300 650 Q 246 628 232 566 Z"/></clipPath>
    <clipPath id="tile"><rect width="1024" height="1024"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <!-- Background -->
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#glowE)"/>
    <rect width="1024" height="1024" fill="url(#glowC)"/>

    <!-- Speed streaks: upper-left to lower-right, ~20 degrees -->
    <g transform="rotate(20 512 512)">
      <g filter="url(#blur6)" opacity="0.95">
        <rect x="-140" y="150" width="620" height="16" rx="8" fill="url(#streakE)"/>
        <rect x="-200" y="560" width="560" height="14" rx="7" fill="url(#streakE)"/>
        <rect x="420" y="330" width="480" height="9" rx="4.5" fill="url(#streakT)"/>
        <rect x="300" y="900" width="560" height="12" rx="6" fill="url(#streakL)"/>
      </g>
      <rect x="-220" y="250" width="520" height="4" rx="2" fill="url(#streakY)"/>
      <rect x="40" y="80" width="560" height="9" rx="4.5" fill="url(#streakE)"/>
      <rect x="-120" y="470" width="420" height="7" rx="3.5" fill="url(#streakE)"/>
      <rect x="560" y="210" width="360" height="6" rx="3" fill="url(#streakC)"/>
      <rect x="-60" y="820" width="460" height="6" rx="3" fill="url(#streakT)"/>
      <rect x="520" y="780" width="420" height="5" rx="2.5" fill="url(#streakL)" opacity="0.9"/>
    </g>

    <g mask="url(#fade)">
    <!-- Bifrost arc: glow -->
    <g fill="none" stroke-linecap="round" filter="url(#blur24)" opacity="0.85">
      <path d="M 132 960 L 132 880 A 380 380 0 0 1 892 880 L 892 960" stroke="#3DB878" stroke-width="40"/>
      <path d="M 212 960 L 212 880 A 300 300 0 0 1 812 880 L 812 960" stroke="#C0242F" stroke-width="40"/>
    </g>
    <!-- Bifrost arc: bands -->
    <g fill="none" stroke-width="22">
      <path d="M 132 960 L 132 880 A 380 380 0 0 1 892 880 L 892 960" stroke="#3DB878"/>
      <path d="M 152 960 L 152 880 A 360 360 0 0 1 872 880 L 872 960" stroke="#5CCBA0"/>
      <path d="M 172 960 L 172 880 A 340 340 0 0 1 852 880 L 852 960" stroke="#9EC3D6"/>
      <path d="M 192 960 L 192 880 A 320 320 0 0 1 832 880 L 832 960" stroke="#C9A7C2"/>
      <path d="M 212 960 L 212 880 A 300 300 0 0 1 812 880 L 812 960" stroke="#C0242F"/>
    </g>

    </g>

    <!-- Horn glow -->
    <path d="M 236 566 Q 262 640 320 650 Q 540 728 790 470 L 640 340 Q 488 612 312 606 Z" fill="#9EC3D6" opacity="0.45" filter="url(#blur24)"/>

    <!-- Horn body -->
    <path d="M 232 566 Q 228 556 238 556 Q 262 598 312 608 Q 488 612 640 345 L 790 470 Q 540 728 300 650 Q 246 628 232 566 Z" fill="url(#horn)"/>
    <path d="M 232 566 Q 228 556 238 556 Q 262 598 312 608 Q 488 612 640 345 L 790 470 Q 540 728 300 650 Q 246 628 232 566 Z" fill="url(#hornShade)"/>
    <!-- Decorative rings -->
    <g fill="none" stroke-linecap="butt" clip-path="url(#hornClip)">
      <path d="M 398 580 Q 418 626 410 680" stroke="#1B2B45" stroke-width="22" opacity="0.5"/>
      <path d="M 398 580 Q 418 626 410 680" stroke="#C9A7C2" stroke-width="14"/>
      <path d="M 536 490 Q 572 552 586 624" stroke="#1B2B45" stroke-width="24" opacity="0.5"/>
      <path d="M 536 490 Q 572 552 586 624" stroke="#C9A7C2" stroke-width="16"/>
      <path d="M 550 518 Q 566 544 574 570" stroke="#FFFFFF" stroke-width="4" opacity="0.7"/>
    </g>
    <!-- Bell opening -->
    <ellipse cx="715" cy="407" rx="98" ry="30" transform="rotate(40 715 407)" fill="url(#bell)"/>
    <ellipse cx="715" cy="407" rx="98" ry="30" transform="rotate(40 715 407)" fill="none" stroke="#FFFFFF" stroke-width="6" opacity="0.9"/>
  </g>
</svg>
